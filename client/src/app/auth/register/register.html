<div class="container">
    <!-- Left Section -->
    <div class="left-panel">
        <img src="assets/logo.png" alt="Logo" class="logo" />

        <h2>Create Your Account</h2>
        <p>Join us and start your learning journey today!</p>

        <form [formGroup]="registerForm" (ngSubmit)="onSubmit()">
            <div class="form-group">
                <label>First Name</label>
                <input type="text" formControlName="firstName" placeholder="Enter your full name" />
            </div>
            <div class="form-group">
                <label>Last Name</label>
                <input type="text" formControlName="lastName" placeholder="Enter your full name" />
            </div>
            <div class="form-group">
                <label>Email</label>
                <input type="email" formControlName="email" placeholder="Enter your email" />
            </div>

            <div class="form-group">
                <label>Password</label>
                <input type="password" formControlName="password" placeholder="Enter password" />
            </div>

            <div class="form-group">
                <label>Confirm Password</label>
                <input type="password" formControlName="confirmPassword" placeholder="Re-enter password" />
            </div>

            <button type="submit" class="btn" [disabled]="registerForm.invalid">Register</button>
        </form>

        <p class="login-link">
            Already have an account?
            <a routerLink="/auth/login">Login</a>
        </p>
    </div>

    <!-- Right Section -->
    <div class="right-panel">
        <div class="promo">
            <h3>Access 1,000+ Mock Tests</h3>
            <p>Practice, Learn, and Achieve your goals with us!</p>
            <img src="assets/education-illustration.png" alt="Education Image" />
        </div>
    </div>
</div>
